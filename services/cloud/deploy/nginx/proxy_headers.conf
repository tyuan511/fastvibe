# Included in every FastVibe location. nginx drops *all* inherited proxy_set_header
# lines the moment a location sets one of its own, so these cannot live at server level.
#
# This nginx is the edge, so each header is overwritten, never appended to: whatever a
# client sent in X-Forwarded-For or X-Real-IP is a claim, not an address. The cloud
# service believes X-Real-IP only from this nginx (http.trusted_proxies).
#
# If a CDN is ever put in front, $remote_addr becomes the CDN: configure the realip
# module (set_real_ip_from <CDN ranges>; real_ip_header ...) at the same time.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
