# FastVibe upstreams, for the server's existing nginx. Include once in the http {}
# context:
#
#   http {
#       include /etc/nginx/fastvibe/upstreams.conf;
#       ...
#   }
#
# The cloud service listens on 127.0.0.1:9089 and the website on 127.0.0.1:9088;
# neither is 8080, which Jenkins usually holds.

upstream fastvibe_cloud {
    server 127.0.0.1:9089;
    keepalive 32;
}

upstream fastvibe_website {
    server 127.0.0.1:9088;
    keepalive 16;
}
