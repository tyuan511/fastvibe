# FastVibe routes for app.fastvibe.dev. Include inside the server {} block that
# terminates TLS for that host (see app.fastvibe.dev.conf.example):
#
#   server {
#       server_name app.fastvibe.dev;
#       ...
#       include /etc/nginx/fastvibe/locations.conf;
#   }

# /llm requests carry base64 images; matches the service's http.body_limit (32 MiB).
client_max_body_size 32m;

location /api/ {
    include /etc/nginx/fastvibe/proxy_headers.conf;
    proxy_pass http://fastvibe_cloud;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

# Token streams. Every byte must reach the client as the upstream sends it: no
# response buffering and no compression (both hold bytes back), and timeouts longer
# than the service's own 30-minute cap on one reply. A server-level `gzip on` would
# otherwise apply here too, hence the explicit off.
location /llm/ {
    include /etc/nginx/fastvibe/proxy_headers.conf;
    proxy_pass http://fastvibe_cloud;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 35m;
    proxy_send_timeout 35m;
}

location / {
    include /etc/nginx/fastvibe/proxy_headers.conf;
    proxy_pass http://fastvibe_website;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
