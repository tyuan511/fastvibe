# Postgres and the cloud service. There is no proxy in this stack: the server's own
# nginx is the edge and reaches the service at 127.0.0.1:9089 (deploy/nginx/).
# The website is packaged and run separately.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   curl http://127.0.0.1:9089/api/readyz

name: fastvibe-cloud

networks:
  default:
    ipam:
      config:
        # Fixed so the service can be told exactly which address its proxy arrives
        # from: a host nginx reaching a published port shows up as the gateway.
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fastvibe
      POSTGRES_PASSWORD: fastvibe
      POSTGRES_DB: cloud
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastvibe -d cloud"]
      interval: 2s
      timeout: 3s
      retries: 30

  cloud:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # development: GitHub sign-in may be left unconfigured, cookies work over http.
      # Production refuses to start without GitHub credentials.
      FASTVIBE_ENV: ${FASTVIBE_ENV:-development}
      FASTVIBE_LOG__FORMAT: json
      # What the browser sees. For sign-in on a laptop, run the website on :9088 (it proxies
      # /api here) and use http://localhost:9088, the same origin as the OAuth callback.
      FASTVIBE_PUBLIC_ORIGIN: ${FASTVIBE_PUBLIC_ORIGIN:-http://localhost:9088}
      FASTVIBE_GITHUB__CLIENT_ID: ${FASTVIBE_GITHUB__CLIENT_ID:-}
      FASTVIBE_GITHUB__CLIENT_SECRET: ${FASTVIBE_GITHUB__CLIENT_SECRET:-}
      FASTVIBE_ADMIN__GITHUB_IDS: ${FASTVIBE_ADMIN__GITHUB_IDS:-}
      FASTVIBE_DATABASE__URL: postgres://fastvibe:fastvibe@postgres:5432/cloud?sslmode=disable
      FASTVIBE_HTTP__TRUSTED_PROXIES: 172.30.0.1
      FASTVIBE_LOG__LEVEL: ${FASTVIBE_LOG__LEVEL:-info}
    ports:
      # Loopback only: nothing but the host's nginx should reach it. Not 8080,
      # which Jenkins usually holds on the same machine.
      - "127.0.0.1:9089:9089"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
