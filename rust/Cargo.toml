[workspace]
resolver = "3"
members = ["fastvibe-iroh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
base64 = "0.22"
iroh = "1.4.1"
iroh-relay = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "fs"] }
tracing = "0.1"
