[workspace]
resolver = "3"
members = ["crates/fastvibe-core", "crates/fastvibe-app"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

