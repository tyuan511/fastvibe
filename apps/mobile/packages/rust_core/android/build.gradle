group = 'dev.fastvibe.rust_core'
version = '0.5.13'

apply plugin: 'com.android.library'

android {
    namespace 'dev.fastvibe.rust_core'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 24
    }

    sourceSets {
        main.jniLibs.srcDirs = ['src/main/jniLibs']
    }
}

// ffiPlugin packages the Rust library directly; no JNI shim or plugin channel is used.
// Fail here rather than shipping an APK whose first DynamicLibrary.open fails.
tasks.register('verifyRustCore') {
    def library = file('src/main/jniLibs/arm64-v8a/libfastvibe_mobile_core.so')
    inputs.file(library)
    doLast {
        if (!library.isFile()) {
            throw new GradleException('Rust mobile core is missing. Run bash scripts/build-mobile-android-core.sh from the repository root before building the Flutter APK.')
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyRustCore')
}
