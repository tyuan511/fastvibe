[package]
name = "fastvibe-mobile-core"
version = "0.5.13"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["iroh-transport", "mobile-client"]
iroh-transport = ["dep:iroh", "dep:iroh-relay", "dep:tokio"]
mobile-client = ["dep:reqwest", "dep:url", "dep:rand", "dep:sha2", "dep:rustls", "dep:tokio", "dep:webpki-roots"]

[dependencies]
base64 = "0.22"
flate2 = "1"
iroh = { version = "1.4.1", optional = true }
iroh-relay = { version = "1.4.1", optional = true }
rand = { version = "0.10", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
webpki-roots = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
thiserror = "2"
url = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"], optional = true }

[dev-dependencies]
serde_json = "1"

[patch.crates-io]
# iroh 1.4.1 resolves netwatch 0.19.x and netdev 0.46.x. The newer sources
# add the missing Apple/iOS route and interface cfgs while retaining the same APIs.
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }
