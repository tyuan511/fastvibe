name: fastvibe_mobile
description: "FastVibe mobile client for connecting to saved remote machines"
publish_to: "none"
version: 0.4.2+42

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # iOS 26 / 27 liquid glass: shader-based blur, refraction, jelly physics.
  liquid_glass_widgets: ^1.11.0

  # The same icon set the Expo client draws with, so a screen reads identically.
  hugeicons: ^1.2.0

  # Not used directly: `liquid_glass_widgets` draws several of its defaults with it, and
  # without the font they render as blank boxes.
  cupertino_icons: ^1.0.8

  # Markdown with tables, code fences and LaTeX (`$…$` / `$$…$$`).
  gpt_markdown: ^1.3.4

  # Navigation. The Expo client's file routes map one-to-one onto these paths.
  go_router: ^18.0.2

  # Device token (Keychain / Keystore) and this phone's preferences.
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # App Protocol v1: one WebSocket, one login.
  web_socket_channel: ^3.0.3
  http: ^1.6.0

  # QR code that connects this phone to a machine.
  mobile_scanner: ^7.4.2

  # Photos: picked, scaled to 2048px, re-encoded as JPEG before they cross the socket.
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1

  # Background activity notices, and whether the phone is on a network at all.
  flutter_local_notifications: ^22.3.1
  # 7.3.2 needs `nm ^0.6.0` → `dbus ^0.8.0`, which flutter_local_notifications_linux
  # pins to ^0.7.8. 7.3.1 is the newest that resolves with the notifications plugin.
  connectivity_plus: ^7.3.1

  url_launcher: ^6.3.3
  path_provider: ^2.1.6

  # Android self-update: download the APK and hand it to the installer.
  dio: ^5.11.1
  open_filex: ^4.7.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

  crypto: ^3.0.7

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Regenerates every launcher icon and splash from `assets/` — the same artwork the
  # Expo client ships, so the two builds are the same app to a home screen.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/

# `dart run flutter_launcher_icons` — the icon is the app's identity, so it is generated
# from the shared artwork rather than hand-placed per density.
flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/android/background.png"
  adaptive_icon_foreground: "assets/android/foreground.png"
  adaptive_icon_monochrome: "assets/android/monochrome.png"

# `dart run flutter_native_splash:create` — the launch screen the OS draws before Dart
# starts, in both themes.
flutter_native_splash:
  color: "#ffffff"
  image: assets/splash.png
  color_dark: "#000000"
  image_dark: assets/splash.png
  android_12:
    image: assets/splash.png
    color: "#ffffff"
    image_dark: assets/splash.png
    color_dark: "#000000"
  ios: true
  android: true
