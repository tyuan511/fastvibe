<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>FastVibe</title>
    <style>
      /*
        A chrome-less panel that has to read as the row the user is about to create in
        System Settings › Privacy & Security — an app icon, an app name, a switch — so
        that dropping it into that list is the obvious thing to do with it.

        Hand-written rather than a third renderer entry: this is 60 lines of static
        markup in a 300×86 window, and mounting the app's React tree to draw one row
        would cost a page load, a preload round-trip and a theme subscription to
        render something that never changes.
      */
      :root {
        color-scheme: light dark;
        --panel: #ffffff;
        --text: #1d1d1f;
        --muted: #86868b;
        --border: rgba(0, 0, 0, 0.08);
        --switch: #34c759;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --panel: #2c2c2e;
          --text: #f5f5f7;
          --muted: #98989d;
          --border: rgba(255, 255, 255, 0.1);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: transparent;
        font: 13px/1.4 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
        color: var(--text);
        overflow: hidden;
        user-select: none;
        cursor: grab;
      }
      body:active { cursor: grabbing; }

      /* The one strip that moves the window instead of starting a file drag, so a
         panel sitting exactly where the user needs to drop can be pushed aside. */
      .grip {
        height: 14px;
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .grip::after {
        content: "";
        width: 32px;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
      }

      .card {
        margin: 0 8px 8px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      }
      .icon { width: 30px; height: 30px; border-radius: 7px; flex: none; }
      .labels { min-width: 0; flex: 1; }
      .name { font-weight: 590; letter-spacing: -0.01em; }
      .hint {
        margin-top: 1px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Inert: it is there because the real row has one, and a row without it does
         not read as the thing being dragged into place. */
      .switch {
        width: 34px;
        height: 20px;
        border-radius: 10px;
        background: var(--switch);
        flex: none;
        position: relative;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 16px;
        height: 16px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="grip"></div>
    <div class="card">
      <img class="icon" src="../icon.png" alt="" />
      <div class="labels">
        <div class="name">FastVibe</div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="switch"></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const HINTS = {
        accessibility: { zh: "拖到「辅助功能」列表", en: "Drag into the Accessibility list" },
        screenRecording: { zh: "拖到「屏幕录制」列表", en: "Drag into the Screen Recording list" },
      };
      const permission = params.get("permission") === "screenRecording" ? "screenRecording" : "accessibility";
      const lang = params.get("lang") === "en" ? "en" : "zh";
      document.getElementById("hint").textContent = HINTS[permission][lang];

      // Chromium would otherwise start its own (text) drag, which cancels the native
      // file drag Main begins — the bundle has to travel as a file for the Privacy
      // list to accept the drop.
      document.addEventListener("dragstart", (event) => {
        event.preventDefault();
        window.fastvibe?.computer?.startDrag();
      });
      // A chrome-less window has no close button of its own.
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.fastvibe?.computer?.closeGrantOverlay();
      });
      document.body.setAttribute("draggable", "true");
    </script>
  </body>
</html>
