<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: fastvibe-icon:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light/dark tiles follow the OS scheme; icon.png is the no-media fallback. -->
    <link rel="icon" type="image/png" href="/icon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/icon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>FastVibe</title>
    <style>
      /*
       * Boot splash.
       *
       * Painted from the raw document so the brand mark is already breathing
       * before the module bundle runs — in dev the app stylesheet only arrives
       * with JS, so a rule in index.css would land too late. The splash is a
       * solid, un-themed background with the mark centred; `dismissBootLoader()`
       * fades the node out once the shell is ready, so the hand-off to the app is
       * a single opacity transition rather than a restart.
       *
       * The loader rules below are duplicated for the React <FLoader> in index.css
       * (which cannot be relied on pre-JS); keep the two in sync.
       */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      /*
       * Un-themed first paint. index.css defaults to light, but Electron mirrors
       * the persisted theme into prefers-color-scheme, so match that here until
       * applyTheme() stamps data-theme and installs the real tokens.
       */
      html:not([data-theme]) {
        color-scheme: light;
        --background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          color-scheme: dark;
          --background: #0d1117;
        }
      }

      #fastvibe-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background, #ffffff);
        transition: opacity 220ms ease;
      }
      #fastvibe-boot[data-dismissed] {
        opacity: 0;
        pointer-events: none;
      }
      #fastvibe-boot .fv-loader {
        width: 96px;
        height: 96px;
      }

      /* The brand mark breathing under a soft halo — shared with index.css. */
      .fv-loader {
        position: relative;
        display: grid;
        place-items: center;
      }
      .fv-loader-glow {
        position: absolute;
        inset: -18%;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(109, 124, 255, 0.45), rgba(109, 124, 255, 0) 68%);
        filter: blur(6px);
        animation: fv-loader-halo 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }
      .fv-loader-mark {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        animation: fv-loader-breathe 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }
      @keyframes fv-loader-breathe {
        0%,
        100% {
          transform: scale(0.95);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes fv-loader-halo {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.93);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fv-loader-mark,
        .fv-loader-glow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="fastvibe-boot" role="status" aria-label="正在加载 FastVibe">
      <span class="fv-loader">
        <span class="fv-loader-glow" aria-hidden="true"></span>
        <img class="fv-loader-mark" src="./src/assets/f-mark.png" alt="" aria-hidden="true" />
      </span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
