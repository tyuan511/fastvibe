<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: fastvibe-icon:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light/dark tiles follow the OS scheme; icon.png is the no-media fallback. -->
    <link rel="icon" type="image/png" href="/icon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/icon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>FastVibe</title>
    <style>
      /*
       * Boot splash.
       *
       * Painted from the raw document so the F mark is already animating before the
       * module bundle runs — in dev the app stylesheet only arrives with JS, so a
       * rule in index.css would land too late. `dismissBootLoader()` fades this
       * node out once the shell is ready; it is never unmounted, so the stroke
       * animation runs continuously across the JS boundary and the hand-off is a
       * single opacity transition rather than a restart.
       *
       * The loader rules below are duplicated for the React <FLoader> in index.css
       * (which cannot be relied on pre-JS); keep the two in sync.
       */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      /*
       * Un-themed first paint. index.css defaults to light, but Electron mirrors
       * the persisted theme into prefers-color-scheme, so match that here until
       * applyTheme() stamps data-theme and installs the real tokens.
       */
      html:not([data-theme]) {
        color-scheme: light;
        --background: #ffffff;
        --muted-foreground: #59636e;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          color-scheme: dark;
          --background: #0d1117;
          --muted-foreground: #9198a1;
        }
      }

      #fastvibe-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background, #ffffff);
        color: var(--muted-foreground, #9198a1);
        transition: opacity 220ms ease;
      }
      #fastvibe-boot[data-dismissed] {
        opacity: 0;
        pointer-events: none;
      }
      #fastvibe-boot svg {
        display: block;
        width: 88px;
        height: 88px;
      }

      .fv-loader-path {
        fill: none;
        stroke: currentColor;
        stroke-width: 30;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        animation: fv-loader-trace 2.4s ease-in-out infinite;
      }
      @keyframes fv-loader-trace {
        0% {
          stroke-dashoffset: 1;
        }
        55% {
          stroke-dashoffset: 0;
        }
        80% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fv-loader-path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>

</html>
