_version: 2
browser.auto:
  zh: "自动选择"
  en: "Automatic"
browser.use_system:
  zh: "使用系统浏览器"
  en: "Use system browser"
browser.use_system_desc:
  zh: "让智能体在已安装的浏览器中操作网页；关闭时使用内嵌浏览器。"
  en: "Let the agent operate an installed browser. Turn off to use the embedded browser."
browser.engine:
  zh: "浏览器"
  en: "Browser"
browser.engine_desc:
  zh: "使用独立的 FastVibe 配置目录，可从下方导入登录态。"
  en: "Uses a separate FastVibe profile. Import login cookies below."
browser.import_title:
  zh: "从浏览器导入"
  en: "Import from browser"
browser.import_desc:
  zh: "将现有浏览器的 Cookie 导入内嵌浏览器，复用网站登录状态。"
  en: "Import cookies from an existing browser into the embedded browser."
browser.import_system_desc:
  zh: "将现有浏览器的 Cookie 导入所选系统浏览器的 FastVibe 配置目录。"
  en: "Import cookies into the selected system browser's FastVibe profile."
browser.refresh:
  zh: "刷新"
  en: "Refresh"
browser.loading:
  zh: "正在查找浏览器配置…"
  en: "Finding browser profiles…"
browser.no_profiles:
  zh: "未找到可导入的浏览器配置"
  en: "No browser profiles found"
browser.profile_desc:
  zh: "导入网站 Cookie；系统可能请求钥匙串访问权限。"
  en: "Import website cookies. The system may request Keychain access."
browser.importing:
  zh: "正在导入…"
  en: "Importing…"
browser.import_action:
  zh: "导入"
  en: "Import"
browser.import_done:
  zh: "已导入 %{count} 个 Cookie，跳过 %{skipped} 个无法解密或已失效的 Cookie"
  en: "Imported %{count} cookies; skipped %{skipped} unreadable or expired cookies"
browser.pick:
  zh: "选取网页元素"
  en: "Pick page element"
browser.pick_cancel:
  zh: "取消选取"
  en: "Cancel selection"
browser.pick_hint:
  zh: "将鼠标移到网页上，点击元素即可附加到对话；再次点击选取按钮可取消。"
  en: "Hover over the page and click an element to attach it to the chat. Click the picker again to cancel."
