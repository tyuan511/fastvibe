_version: 2

computer.allow:
  zh: "允许操作电脑"
  en: "Allow computer control"
computer.allow_description:
  zh: "让智能体查看屏幕、点击和输入，操作你电脑上的应用。"
  en: "Let the agent see the screen, click and type in apps on this computer."
computer.driver:
  zh: "驱动"
  en: "Driver"
computer.driver_name:
  zh: "电脑操控组件"
  en: "Computer-control component"
computer.driver_missing:
  zh: "未下载"
  en: "Not downloaded"
computer.check_update:
  zh: "检查更新"
  en: "Check for updates"
computer.update:
  zh: "更新"
  en: "Update"
computer.retry:
  zh: "重试"
  en: "Retry"
computer.close:
  zh: "关闭"
  en: "Close"
computer.driver_dialog_title:
  zh: "下载电脑操控组件"
  en: "Download the computer-control component"
computer.driver_dialog_description:
  zh: "使用电脑操控需要先下载这个组件。"
  en: "Computer control needs this component before it can run."
computer.permissions:
  zh: "系统权限"
  en: "System permissions"
computer.control:
  zh: "控制"
  en: "Control"
computer.unsupported:
  zh: "这台电脑不支持电脑操控。"
  en: "Computer control is not available on this computer."
computer.downloading:
  zh: "正在下载电脑操控组件…"
  en: "Downloading the computer-control component…"
computer.downloading_progress:
  zh: "正在下载电脑操控组件：%{received} / %{total}"
  en: "Downloading the computer-control component: %{received} / %{total}"
computer.installed:
  zh: "组件版本 %{version} · %{state}"
  en: "Component %{version} · %{state}"
computer.running:
  zh: "运行中"
  en: "running"
computer.waiting:
  zh: "等待启动"
  en: "starting"
computer.stopped:
  zh: "已关闭"
  en: "off"
computer.download:
  zh: "下载电脑操控组件"
  en: "Download the computer-control component"
computer.accessibility:
  zh: "辅助功能"
  en: "Accessibility"
computer.screen_recording:
  zh: "屏幕录制"
  en: "Screen Recording"
computer.granted:
  zh: "已授权"
  en: "Granted"
computer.not_granted:
  zh: "未授权。授权后才能控制电脑。"
  en: "Not granted. Computer control needs it."
computer.open_settings:
  zh: "打开系统设置"
  en: "Open System Settings"
computer.relaunch_note:
  zh: "授权后，屏幕录制通常需要重新打开 FastVibe 才生效。"
  en: "After granting, Screen Recording usually takes effect only once FastVibe is reopened."
computer.daemon_exited:
  zh: "电脑操控组件意外退出了。"
  en: "The computer-control component exited unexpectedly."
computer.component_missing:
  zh: "找不到电脑操控组件：%{path}"
  en: "Computer-control component not found: %{path}"
computer.launch_failed:
  zh: "无法启动电脑操控组件：%{detail}"
  en: "Could not start the computer-control component: %{detail}"
computer.start_exited:
  zh: "电脑操控组件启动后退出了：%{detail}"
  en: "The computer-control component exited during startup: %{detail}"
computer.start_timeout:
  zh: "电脑操控组件未能及时就绪。请重试，或重新下载组件。"
  en: "The computer-control component did not become ready in time. Retry or download it again."
computer.background:
  zh: "优先后台投递"
  en: "Prefer background delivery"
computer.background_description:
  zh: "支持此选项的动作默认不抢焦点；仍可明确请求前台操作。不支持后台投递时会报错。"
  en: "Default to background delivery for actions that support it; an explicit foreground request still takes priority. Unsupported background delivery returns an error."
computer.clipboard:
  zh: "读写剪贴板"
  en: "Read and write the clipboard"
computer.clipboard_description:
  zh: "允许电脑工具读写共享剪贴板；写入会覆盖原有内容。"
  en: "Allow computer tools to read and write the shared clipboard; writing replaces its contents."
