_version: 2

memory.loading_memory_status:
  zh: "正在读取记忆设置…"
  en: "Loading memory settings…"
memory.follow_default_model:
  zh: "跟随默认模型"
  en: "Follow the default model"
memory.title:
  zh: "长期记忆"
  en: "Long-term memory"
memory.enable:
  zh: "启用长期记忆"
  en: "Enable long-term memory"
memory.enable_desc:
  zh: "对话安静一段时间后，整理出其中值得长期记住的内容，之后的对话会参考。"
  en: "Once a conversation has been quiet for a while, keep what is worth remembering and let later conversations use it."
memory.model:
  zh: "整理用的模型"
  en: "Model for memory"
memory.model_desc:
  zh: "读取对话和汇总记忆时使用的模型。"
  en: "Reads conversations and consolidates memory with this model."
memory.data_title:
  zh: "记忆库"
  en: "Memory"
memory.status:
  zh: "整理状态"
  en: "Status"
memory.extracting:
  zh: "正在读取最近的对话…"
  en: "Reading recent conversations…"
memory.consolidating:
  zh: "正在汇总记忆…"
  en: "Consolidating memory…"
memory.empty:
  zh: "还没有整理出记忆。对话安静六小时后才会被读取。"
  en: "Nothing remembered yet. A conversation is read after it has been quiet for six hours."
memory.counts:
  zh: "已从 %{count} 个对话整理出记忆，%{pending} 个等待整理。"
  en: "Memory from %{count} conversations; %{pending} waiting."
memory.last_run:
  zh: "上次整理 %{time}"
  en: "Last run %{time}"
memory.run_now:
  zh: "立即整理"
  en: "Run now"
memory.files:
  zh: "记忆文件"
  en: "Memory files"
memory.files_desc:
  zh: "保存在本机的 Markdown 文件；关闭记忆不会删除它们。"
  en: "Markdown files on this computer. Turning memory off does not delete them."
memory.open_folder:
  zh: "打开文件夹"
  en: "Open folder"
memory.clear:
  zh: "清除"
  en: "Clear"
memory.confirm_clear:
  zh: "确认清除"
  en: "Confirm"
memory.clear_confirm:
  zh: "确定清除全部长期记忆吗？再点一次「确认清除」。"
  en: "Clear all long-term memory? Click Confirm to proceed."
