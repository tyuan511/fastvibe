mod.the_app_update_is_not:
  zh: "应用更新尚未完成。请等待任务结束、关闭仍在运行的终端后重新打开窗口，以启用最新功能。"
  en: "The app update is not finished yet. Wait for running tasks to end, close any running terminals, then reopen the window to use the latest features."
mod.this_turn_s_reply_will:
  zh: "这一轮的回复会丢弃并重新生成。工作区文件可以一起退回到这一轮开始之前。"
  en: "This turn's reply will be discarded and generated again. Workspace files can be rolled back to how they were before this turn."
mod.no_model_is_available_yet:
  zh: "还没有可用的模型：先到 设置 → 模型与默认 添加供应商。"
  en: "No model is available yet. Add a provider in Settings → Models & defaults first."
mod.could_not_read_the_saved:
