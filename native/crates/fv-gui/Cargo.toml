[package]
name = "fv-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fv_gui"
path = "src/lib.rs"

[[bin]]
name = "fastvibe"
path = "src/main.rs"

[features]
# `Window::render_to_image` is behind GPUI's test-support feature; the visual-regression
# harness (and only it) needs the captured frame.
capture = ["dep:image", "dep:gpui-capture", "dep:gpui-macos-capture"]

[dependencies]
fv-env = { path = "../fv-env" }
gpui-kit = { version = "0.8.0", features = [
    "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript",
    "tree-sitter-rust", "tree-sitter-python", "tree-sitter-bash",
    "tree-sitter-html", "tree-sitter-css", "tree-sitter-toml", "tree-sitter-yaml",
] }
fv-theme = { path = "../fv-theme" }
fv-protocol = { path = "../fv-protocol" }
fv-core = { path = "../fv-core" }
fv-client = { path = "../fv-client" }
fv-daemon = { path = "../fv-daemon" }
tokio.workspace = true
futures-util.workspace = true
futures-channel = "0.3"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
url = "2"
rust-i18n = "3"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
iana-time-zone = "0.1.65"
chrono-tz = "0.10.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Same crates gpui-kit already uses (it pins them exactly), named again only to switch on
# their test-support features. Going through `gpui-kit/test-support` instead drags in the
# optional gpui-fast backend, which cannot share a lockfile with the gpui-pre one.
gpui-capture = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"], optional = true }
gpui-macos-capture = { package = "gpui-pre-macos", version = "=0.3.9", features = ["test-support"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The window's own vibrancy view (see `vibrancy.rs`); both are already in the lockfile via GPUI.
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
objc = "0.2"
core-foundation = "0.10"
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
# Headless layout tests (see `workspace::pane::preview_scroll_tests` and `workspace::sticky`):
# GPUI's own test harness, which lives behind the same `test-support` feature as the optional
# `gpui-capture` above — so it is that same dependency under that same name, and not a second one.
# Two names for one crate make rustc refuse the build outright ("the crate fv-gui depends on crate
# gpui-pre multiple times with different names"), which is what broke every `--features capture`
# build, and with it `scripts/compare-ui.sh`, for as long as both spellings were listed.
gpui-capture = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[lints]
workspace = true
