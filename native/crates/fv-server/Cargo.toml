[package]
name = "fv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fv_server"

[[bin]]
name = "fastvibe-server"
path = "src/main.rs"

[dependencies]
fv-update = { path = "../fv-update" }
reqwest = { version = "0.13", features = ["rustls", "json"] }
fv-env = { path = "../fv-env" }
fv-protocol = { path = "../fv-protocol" }
fv-core = { path = "../fv-core" }
fv-agent = { path = "../fv-agent" }
fv-sandbox = { path = "../fv-sandbox" }
fv-store = { path = "../fv-store" }
fv-provider = { path = "../fv-provider" }
fv-tools = { path = "../fv-tools" }
fv-mcp = { path = "../fv-mcp" }
fv-import = { path = "../fv-import" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
serde_yaml = "0.9"
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
uuid = { version = "1", features = ["v4"] }

sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
portable-pty = "0.9"
alacritty_terminal = "0.26"
libc = "0.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
similar = "2"
tempfile = "3"
trash = { version = "5.2.9", default-features = false, features = ["coinit_multithreaded"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
fv-client = { path = "../fv-client" }

[lints]
workspace = true
