[package]
name = "fv-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fv-env = { path = "../fv-env" }
fv-agent = { path = "../fv-agent" }
fv-core = { path = "../fv-core" }
fv-protocol = { path = "../fv-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["rustls"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
