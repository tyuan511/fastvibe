[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
# 0.3.9 adds destination alpha in the final Metal pass, making layered glass opaque/grey.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# Backdrop blur for glass overlays: a `Backdrop` primitive and `Window::paint_backdrop`,
# which the registry crate has no way to express. See vendor/gpui-pre/FASTVIBE.md.
gpui-pre = { path = "vendor/gpui-pre" }

# Stable history positions for independent terminal clients; see vendor patch notes.
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# Hash the build fingerprint at release speed even in a dev build. `sha2`/`digest` are
# interpreted in a dev profile, and hashing the 120 MB debug server took 5 s — which the
# first client pays for: `initialize` reports the fingerprint, so the socket answered
# seconds after it was already listening.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
