name: Mobile iOS TestFlight

# Builds the phone app for iOS and uploads it to TestFlight.
#
# Run it by hand first (Actions → Mobile iOS TestFlight → Run workflow, `upload` off) to
# check that signing works: that stops after exporting an .ipa and attaches it to the run.
# Pushing an `app-v*` tag uploads to TestFlight too once the repository variable
# TESTFLIGHT_AUTO is `true`; until then a tag push does nothing here, so the Android
# release is never held up by, or reported failed because of, an iOS setup that is
# not finished.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "app-v* tag to build (empty: the selected branch)"
        required: false
        default: ""
      upload:
        description: "Upload the build to TestFlight (off: export the .ipa only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS app
    if: github.event_name == 'workflow_dispatch' || vars.TESTFLIGHT_AUTO == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/app-v') && github.ref_name) || '' }}
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      # Team that owns the App ID and the App Store Connect record. Set the repository
      # variable APPLE_TEAM_ID to build for another team.
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'J24Y9W38D8' }}
      # TestFlight orders uploads of one version by build number, so it has to rise on
      # every run, including a rerun of the same workflow. Flutter writes it to Info.plist.
      FASTVIBE_IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/mobile_flutter/pubspec.yaml
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('apps/mobile_flutter/pubspec.lock') }}

      - name: Verify mobile release version
        run: bash apps/mobile_flutter/tool/check_release.sh

      - name: Verify generated translations
        run: node apps/mobile_flutter/tool/gen_i18n.mjs --check

      - name: Install Flutter dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get --enforce-lockfile

      - name: Analyze mobile app
        working-directory: apps/mobile_flutter
        run: flutter analyze

      - name: Test mobile app
        working-directory: apps/mobile_flutter
        run: flutter test

      - name: Show toolchain
        run: |
          xcodebuild -version
          pod --version

      # xcodebuild takes the App Store Connect API key as a *file*. With it, automatic
      # signing creates or reuses the distribution certificate and the App Store
      # provisioning profile in the account, so no certificate or profile is kept here.
      - name: Write App Store Connect key
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8" -a -n "$APPLE_API_KEY_ID" -a -n "$APPLE_API_ISSUER"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "ASC_AUTH=-authenticationKeyPath $RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 -authenticationKeyID $APPLE_API_KEY_ID -authenticationKeyIssuerID $APPLE_API_ISSUER" >> "$GITHUB_ENV"

      # Archived unsigned, signed at export. An automatic-signing archive asks for an
      # "iOS App Development" profile, and Apple will not make one for a team with no
      # registered device ("Your team has no devices from which to generate a
      # provisioning profile") — which is every team that only ships through TestFlight.
      # The App Store needs a distribution certificate, not a device, and that is what
      # the export step signs with.
      - name: Archive Flutter app
        working-directory: apps/mobile_flutter
        run: flutter build ipa --release --no-codesign --build-number "$FASTVIBE_IOS_BUILD_NUMBER"

      - name: Export and sign
        run: |
          set -euo pipefail
          destination=export
          if [ "$UPLOAD" = true ]; then destination=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>${destination}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          # shellcheck disable=SC2086
          xcodebuild -exportArchive \
            -archivePath apps/mobile_flutter/build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates $ASC_AUTH \
            | xcbeautify --renderer github-actions
          ls -lh "$RUNNER_TEMP/export" || true

      - name: Upload .ipa artifact
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FastVibe-ios-${{ env.RELEASE_TAG || github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
