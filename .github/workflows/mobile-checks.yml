name: Native mobile checks

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile-*.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path apps/mobile/core/Cargo.toml
      - run: cargo check --manifest-path apps/mobile/core/Cargo.toml --no-default-features
      - run: cargo check --manifest-path apps/mobile/core/Cargo.toml --no-default-features --features mobile-client
      - run: cargo check --manifest-path apps/mobile/core/Cargo.toml --no-default-features --features iroh-transport
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest :native:testDebugUnitTest :app:assembleDebug
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/mobile/ios
