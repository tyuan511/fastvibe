name: Mobile checks

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "scripts/*mobile*.sh", ".github/workflows/mobile-*.yml"]
  pull_request:
    paths: ["apps/mobile/**", "scripts/*mobile*.sh", ".github/workflows/mobile-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/core
      - run: cargo test --locked --manifest-path apps/mobile/core/Cargo.toml
      - run: cargo check --locked --manifest-path apps/mobile/core/Cargo.toml --no-default-features
      - run: cargo check --locked --manifest-path apps/mobile/core/Cargo.toml --no-default-features --features mobile-client
      - run: cargo check --locked --manifest-path apps/mobile/core/Cargo.toml --no-default-features --features iroh-transport
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true
      - working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/core
      - working-directory: apps/mobile/android
        run: bash tool/build.sh
  ios:
    uses: ./.github/workflows/mobile-ios.yml
