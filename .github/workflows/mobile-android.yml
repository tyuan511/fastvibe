name: Mobile Android APK

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already includes the Android SDK, platform 35 and build tools.
      # Do not run android-actions/setup-android here: its legacy `sdkmanager tools`
      # call fails against current SDK repositories before the build can start.

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile app
        run: pnpm --filter @fastvibe/mobile typecheck

      - name: Verify app tag version
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('apps/mobile/app.json','utf8')).expo.version;if(process.env.GITHUB_REF_NAME !== 'app-v'+v) process.exit(1)"

      # The native project is generated only inside CI. Keep the Expo project managed in
      # the repository and do not commit android/ or ios/ directories.
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install --non-interactive

      - name: Decode Android release keystore
        env:
          FASTVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FASTVIBE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FASTVIBE_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$FASTVIBE_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/fastvibe-release.keystore"
          chmod 600 "$RUNNER_TEMP/fastvibe-release.keystore"

      # The config plugin wires these CI-only environment variables into the generated
      # release signing config. The key never enters the repository or the APK artifact.
      - name: Build signed release APK
        working-directory: apps/mobile/android
        env:
          FASTVIBE_ANDROID_STORE_FILE: ${{ runner.temp }}/fastvibe-release.keystore
          FASTVIBE_ANDROID_STORE_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_STORE_PASSWORD }}
          FASTVIBE_ANDROID_KEY_ALIAS: ${{ secrets.FASTVIBE_ANDROID_KEY_ALIAS }}
          FASTVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name and verify APK
        run: |
          set -euo pipefail
          apk="FastVibe-${GITHUB_REF_NAME}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          ls -lh "$apk" "$apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastVibe-${{ github.ref_name }}-android
          path: |
            FastVibe-${{ github.ref_name }}.apk
            FastVibe-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FastVibe Mobile ${{ github.ref_name }}
          body: |
            Android APK for direct download. This build is signed with FastVibe's release key.

            The SHA-256 checksum is included as `FastVibe-${{ github.ref_name }}.apk.sha256`.
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            FastVibe-${{ github.ref_name }}.apk
            FastVibe-${{ github.ref_name }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
