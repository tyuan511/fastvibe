name: Mobile Android APK

# A release is built on main, not on its tag. Actions caches are scoped by ref: a run
# can restore what its own ref or the default branch saved, and nothing else. A build
# on the tag therefore started cold every time (0 restored, 0 saved — 543 of 617 Gradle
# tasks executed) and wrote a cache no later tag could read. So pushing `app-v*` only
# hands the tag to a workflow_dispatch run on main, which reads and writes main's
# Gradle and Flutter caches and checks out the tag's commit to build.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "app-v* tag to build and publish (empty: build main, publish nothing)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Hand the tag to a build on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-android.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

  build:
    name: Build Android APK ${{ inputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The tag being released, or empty for a plain build of main.
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The release body is docs/release/<tag>.md, written and committed with the version
      # bump, and the app shows it as its 更新日志. Fail here, in seconds, rather than after
      # the build has spent its fifteen minutes.
      - name: Check release note
        if: startsWith(inputs.tag, 'app-v')
        run: node scripts/check-release-note.mjs --tag "$RELEASE_TAG"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/mobile_flutter/pubspec.yaml
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('apps/mobile_flutter/pubspec.lock') }}

      - name: Verify mobile release version
        run: bash apps/mobile_flutter/tool/check_release.sh

      - name: Verify generated translations
        run: node apps/mobile_flutter/tool/gen_i18n.mjs --check

      - name: Install Flutter dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get --enforce-lockfile

      - name: Analyze mobile app
        working-directory: apps/mobile_flutter
        run: flutter analyze

      - name: Test mobile app
        working-directory: apps/mobile_flutter
        run: flutter test

      # The committed Flutter native project is built directly; cache keys follow its
      # dependencies and Gradle configuration, with previous entries as a fallback.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: flutter-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile_flutter/pubspec.lock', 'apps/mobile_flutter/android/**/*.gradle.kts', 'apps/mobile_flutter/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            flutter-gradle-${{ runner.os }}-

      - name: Decode Android release keystore
        env:
          FASTVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FASTVIBE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FASTVIBE_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$FASTVIBE_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/fastvibe-release.keystore"
          chmod 600 "$RUNNER_TEMP/fastvibe-release.keystore"

      # A PKCS12 keystore (keytool's default) keys its entry with the store password,
      # whatever -keypass said, so a separate key password fails at packageRelease after
      # fifteen minutes of compiling. Find out up front which secret actually unlocks the
      # key, with the same KeyStore.getKey call the Android Gradle plugin makes. Only the
      # choice leaves this step; the passwords stay in the secrets.
      - name: Resolve release key password
        id: signing
        env:
          FASTVIBE_ANDROID_STORE_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_STORE_PASSWORD }}
          FASTVIBE_ANDROID_KEY_ALIAS: ${{ secrets.FASTVIBE_ANDROID_KEY_ALIAS }}
          FASTVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          source="$(java .github/scripts/AndroidKeyPassword.java \
            "$RUNNER_TEMP/fastvibe-release.keystore" \
            FASTVIBE_ANDROID_KEY_ALIAS FASTVIBE_ANDROID_STORE_PASSWORD \
            FASTVIBE_ANDROID_KEY_PASSWORD FASTVIBE_ANDROID_STORE_PASSWORD)"
          if [ "$source" = FASTVIBE_ANDROID_STORE_PASSWORD ]; then
            echo "::notice::The release key is unlocked by the store password (PKCS12 keystore)."
            echo "key-password=store" >> "$GITHUB_OUTPUT"
          else
            echo "key-password=key" >> "$GITHUB_OUTPUT"
          fi

      # User Gradle properties outrank the project's local-build memory settings.
      - name: Configure Gradle for CI
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

      - name: Build signed arm64 APK
        working-directory: apps/mobile_flutter
        env:
          FASTVIBE_ANDROID_STORE_FILE: ${{ runner.temp }}/fastvibe-release.keystore
          FASTVIBE_ANDROID_STORE_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_STORE_PASSWORD }}
          FASTVIBE_ANDROID_KEY_ALIAS: ${{ secrets.FASTVIBE_ANDROID_KEY_ALIAS }}
          FASTVIBE_ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.key-password == 'store' && secrets.FASTVIBE_ANDROID_STORE_PASSWORD || secrets.FASTVIBE_ANDROID_KEY_PASSWORD }}
        run: bash tool/build_release.sh

      # Stop the daemon before the cache step packs ~/.gradle, so it is not archiving
      # files the daemon still holds open.
      - name: Stop Gradle daemon
        if: always() && hashFiles('apps/mobile_flutter/android/gradlew') != ''
        working-directory: apps/mobile_flutter/android
        run: ./gradlew --stop

      - name: Name and verify APK
        run: |
          set -euo pipefail
          apk="FastVibe-${RELEASE_TAG:-main-${GITHUB_SHA::7}}-arm64-v8a.apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
          cp apps/mobile_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          ls -lh "$apk" "$apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(inputs.tag, 'app-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: FastVibe Mobile ${{ inputs.tag }}
          body_path: docs/release/${{ inputs.tag }}.md
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Android release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fastvibe-release.keystore"
