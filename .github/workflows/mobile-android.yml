name: Mobile Android APK

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The runner image ships the SDK at this path; stating it here (rather than relying on
    # the image's environment) is what `sdkmanager` and Gradle both read.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `android-actions/setup-android` is deliberately not used: it runs `sdkmanager
      # tools` as part of its own setup, a package the current SDK manager no longer
      # publishes ("Warning: Failed to find package 'tools'"), and so the job failed in
      # its fifth step, before anything was built. The packages this build needs are
      # installed directly instead.
      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses < /dev/null > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile app
        run: pnpm --filter @fastvibe/mobile typecheck

      # The native project is generated only inside CI. Keep the Expo project managed in
      # the repository and do not commit android/ or ios/ directories.
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install --non-interactive

      # The Android project names its own `debug` build type for signing; release builds
      # are signed with the debug keystore Expo generates, which is why the APK below
      # sideloads but cannot be published to a store.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name APK
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "FastVibe-${GITHUB_REF_NAME}.apk"
          ls -lh "FastVibe-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastVibe-${{ github.ref_name }}-android
          path: FastVibe-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30
