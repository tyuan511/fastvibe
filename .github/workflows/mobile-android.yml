name: Mobile Android APK

# Release tags dispatch a build on main so Gradle caches stay reusable. The dispatched run
# checks out the tag, builds the Flutter app with its Rust core, uploads a draft release, and only
# then promotes it after the expected signed asset and checksum are present.
on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile-android.yml"]
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "app-v* tag to build and publish (empty: build main only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || '' }}

jobs:
  dispatch:
    name: Hand the release tag to a build on main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-android.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

  build:
    name: Build Flutter Android APK ${{ inputs.tag || 'main' }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/app-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release note
        if: startsWith(inputs.tag, 'app-v')
        run: node scripts/check-release-note.mjs --tag "$RELEASE_TAG"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # v4 no longer asks sdkmanager for the retired `tools` package (Google stopped serving
      # it, and that single call failed the whole action); `packages` names what is still real.
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/core

      - name: Analyze and test Flutter
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Decode Android release keystore
        if: startsWith(inputs.tag, 'app-v')
        env:
          FASTVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FASTVIBE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FASTVIBE_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$FASTVIBE_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/fastvibe-release.keystore"
          chmod 600 "$RUNNER_TEMP/fastvibe-release.keystore"

      # Resolve the PKCS12 key password exactly as the Android Gradle plugin does. The
      # selected source is the only output; the password values stay in the environment.
      - name: Resolve release key password
        if: startsWith(inputs.tag, 'app-v')
        id: signing
        env:
          FASTVIBE_ANDROID_STORE_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_STORE_PASSWORD }}
          FASTVIBE_ANDROID_KEY_ALIAS: ${{ secrets.FASTVIBE_ANDROID_KEY_ALIAS }}
          FASTVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          source="$(java .github/scripts/AndroidKeyPassword.java \
            "$RUNNER_TEMP/fastvibe-release.keystore" \
            FASTVIBE_ANDROID_KEY_ALIAS FASTVIBE_ANDROID_STORE_PASSWORD \
            FASTVIBE_ANDROID_KEY_PASSWORD FASTVIBE_ANDROID_STORE_PASSWORD)"
          if [ "$source" = FASTVIBE_ANDROID_STORE_PASSWORD ]; then
            echo "::notice::The release key is unlocked by the store password (PKCS12 keystore)."
            echo "key-password=store" >> "$GITHUB_OUTPUT"
          else
            echo "key-password=key" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Flutter Android release
        if: startsWith(inputs.tag, 'app-v')
        working-directory: apps/mobile/android
        env:
          FASTVIBE_ANDROID_STORE_FILE: ${{ runner.temp }}/fastvibe-release.keystore
          FASTVIBE_ANDROID_STORE_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_STORE_PASSWORD }}
          FASTVIBE_ANDROID_KEY_ALIAS: ${{ secrets.FASTVIBE_ANDROID_KEY_ALIAS }}
          FASTVIBE_ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.key-password == 'store' && secrets.FASTVIBE_ANDROID_STORE_PASSWORD || secrets.FASTVIBE_ANDROID_KEY_PASSWORD }}
        run: bash tool/build.sh --release

      - name: Build unsigned debug Flutter Android package
        if: ${{ !startsWith(inputs.tag, 'app-v') }}
        working-directory: apps/mobile/android
        run: bash tool/build.sh

      - name: Stop Gradle daemon
        if: always()
        working-directory: apps/mobile/android
        run: ./gradlew --stop

      - name: Name and verify APK
        id: package
        working-directory: apps/mobile/android
        env:
          FASTVIBE_ANDROID_STORE_PASSWORD: ${{ secrets.FASTVIBE_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          source tool/version.sh
          load_android_version version.properties
          if [[ -n "$RELEASE_TAG" ]]; then
            apk_source="../build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
            apk="FastVibe-${RELEASE_TAG}-arm64-v8a.apk"
            bash tool/verify-release.sh "$apk_source" \
              --keystore "$RUNNER_TEMP/fastvibe-release.keystore" \
              --alias "${{ secrets.FASTVIBE_ANDROID_KEY_ALIAS }}" \
              --store-password-env FASTVIBE_ANDROID_STORE_PASSWORD
          else
            apk_source="../build/app/outputs/flutter-apk/app-debug.apk"
            apk="FastVibe-main-${GITHUB_SHA::7}-arm64-v8a.apk"
          fi
          test -f "$apk_source"
          cp "$apk_source" "$GITHUB_WORKSPACE/$apk"
          (cd "$GITHUB_WORKSPACE" && sha256sum "$apk") > "$GITHUB_WORKSPACE/$apk.sha256"
          echo "asset=$apk" >> "$GITHUB_OUTPUT"
          echo "APK=$apk" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/$apk" "$GITHUB_WORKSPACE/$apk.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove Android release keystore
        if: always() && startsWith(inputs.tag, 'app-v')
        run: rm -f "$RUNNER_TEMP/fastvibe-release.keystore"

  draft:
    name: Upload signed APK to draft release
    needs: build
    if: startsWith(inputs.tag, 'app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: FastVibe-${{ inputs.tag }}-arm64-v8a.apk
          path: release-assets
      - name: Verify staged files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          apk="release-assets/FastVibe-${RELEASE_TAG}-arm64-v8a.apk"
          checksum="$apk.sha256"
          test -s "$apk"
          test -s "$checksum"
          (cd release-assets && sha256sum --check "$(basename "$checksum")")
      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: FastVibe Mobile ${{ inputs.tag }}
          body_path: docs/release/${{ inputs.tag }}.md
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/FastVibe-${{ inputs.tag }}-arm64-v8a.apk
            release-assets/FastVibe-${{ inputs.tag }}-arm64-v8a.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish verified mobile release
    needs: draft
    if: startsWith(inputs.tag, 'app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="FastVibe-${RELEASE_TAG}-arm64-v8a.apk"
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          test "$(jq -r '.isDraft' <<< "$assets")" = true
          jq -e --arg apk "$expected" --arg sha "$expected.sha256" \
            '[.assets[].name] | index($apk) and index($sha)' <<< "$assets" >/dev/null
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
