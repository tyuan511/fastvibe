appId: dev.fastvibe.desktop
productName: FastVibe
copyright: Copyright © 2026 FastVibe

directories:
  buildResources: resources
  output: release
  # Two-package.json layout. `scripts/stage-app.mjs` copies only package.json +
  # out/ here so the asar cannot pick up src/, docs/, tarballs, or other repo
  # files. Production node_modules are still collected from the project.
  app: build/app

# Staging is already an allowlist. Ignore-only globs still add `**/*`, which is
# safe here. Production node_modules are always collected on top of this list.
files:
  - "**/*"
  - "!**/*.map"
  # Non-runtime files inside production dependencies. Brace form is what
  # electron-builder's minimatch actually excludes.
  #
  # These globs are anchored to the *package root* on purpose: an unanchored
  # `**/node_modules/**/doc` also strips nested runtime directories, and `yaml`
  # ships its real code in `dist/doc` (`composer.js` requires `../doc/directives.js`),
  # which crashed the packaged app on launch. Package-root docs/tests/examples are
  # still dropped.
  - "!**/node_modules/*/{docs,doc,example,examples,test,tests,__tests__,powered-test,coverage,.github}{,/**/*}"
  - "!**/node_modules/@*/*/{docs,doc,example,examples,test,tests,__tests__,powered-test,coverage,.github}{,/**/*}"
  - "!**/node_modules/**/*.{test,spec}.{js,cjs,mjs,ts}"
  - "!**/node_modules/node-pty/{src,deps,scripts,third_party}{,/**/*}"
  - "!**/node_modules/koffi/{src,doc,vendor}{,/**/*}"
  - "!**/node_modules/@earendil-works/pi-coding-agent/{docs,examples,dist/bundle}{,/**/*}"
  - "!**/node_modules/openai/src{,/**/*}"
  - "!**/node_modules/@anthropic-ai/sdk/src{,/**/*}"
  - "!**/node_modules/@mistralai/mistralai/{src,tests,examples}{,/**/*}"
  - "!**/node_modules/@google/genai/dist/web{,/**/*}"

# Runtime assets are looked up under process.resourcesPath (src/main/index.ts,
# src/main/engine/models-dev.ts), so they must live outside the asar archive.
extraResources:
  - from: resources/models-dev
    to: models-dev
  # Built-in pi extensions (`/plan`, `/goal`, todo, session-title, web-search) are loaded by path at runtime, so
  # they must stay outside the asar archive.
  - from: resources/extensions
    to: extensions
  # Built-in skills are read from `resourcesPath/skills` at runtime
  # (`builtinSkillPaths`). Without this entry that lookup finds nothing in a packaged
  # build and the skills silently apply only in development.
  - from: resources/skills
    to: skills
  # The floating grant panel is a static page loaded by path into its own window, and
  # it references `../icon.png` — which is why it sits next to the icon out here rather
  # than becoming a third renderer entry point.
  - from: resources/grant-overlay
    to: grant-overlay
  # The `cua-driver` worker (macOS only). It is an executable, so it must live outside
  # the asar; electron-builder re-signs every Mach-O file it finds in the bundle, which
  # is what puts this one under our Developer ID rather than Cua's. Fetched by
  # `scripts/fetch-cua-driver.mjs`, which pins the release, verifies its checksum and
  # splits the universal archive per architecture.
  #
  # `${arch}` matters: `pnpm dist:mac` packages arm64 and x64 from one invocation, so a
  # single path would put the same slice in both. The macro is expanded per build
  # (`platformPackager` passes the current arch into the file matchers), which is what
  # keeps each package to the ~30 MB it can actually run.
  - from: resources/cua-driver/${arch}/cua-driver
    to: cua-driver
  - from: resources/icon.icns
    to: icon.icns
  - from: resources/icon.png
    to: icon.png

# Only unpack what cannot load from asar. Unpacking a whole package (koffi,
# node-pty, …) would leave every other-arch binary uncompressed on disk.
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node-pty/prebuilds/**"
  # cua-driver's native packages ship a shared library (.dylib/.so/.dll) *beside* their
  # .node addon, and the loader resolves it by path from the package directory. Only the
  # .node is covered by the glob above; the shared library would be left inside the asar
  # archive, which dlopen cannot open. Unpack the package so both halves land on disk
  # together — the per-platform `files` filters below keep it to one architecture.
  - "**/node_modules/@trycua/cua-driver-*/**"

# node-pty / koffi / photon ship N-API prebuilds that already work in Electron.
# Avoid running node-gyp against a toolchain the CI image may not have.
npmRebuild: false

# Chromium ships ~45 MB of locale.pak files; the UI is zh-CN with English fallback.
electronLanguages:
  - en
  - zh_CN
  - zh_TW

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # Personal Developer ID identity. This machine also carries a company
  # "Developer ID Application" certificate (Team BLSLB9GA43), and
  # electron-builder's auto-discovery returns the first match it finds, so the
  # identity has to be pinned explicitly rather than left to discovery.
  #
  # The value deliberately omits the `Developer ID Application:` prefix:
  # app-builder-lib's checkPrefix() throws InvalidConfigurationError when the
  # configured name starts with one of appleCertificatePrefixes, on the
  # assumption the prefix is redundant because the cert type is already known.
  #
  # CI keeps working without this certificate in the runner's keychain: when the
  # name matches nothing, reportError() only warns (it throws for MAS builds
  # only), so the unsigned `Package` step still succeeds.
  identity: tang yuan (J24Y9W38D8)
  hardenedRuntime: true
  # Notarization is driven entirely by environment variables (APPLE_API_KEY,
  # APPLE_API_KEY_ID, APPLE_API_ISSUER — see .github/workflows/release.yml).
  # electron-builder 26 accepts only a boolean here: there is no `teamId` under
  # `notarize`, and the team is implied by the signing identity above plus the
  # notarization key. With no credentials in the environment this logs a warning
  # and skips the upload, so a plain `pnpm dist:mac` never talks to Apple.
  notarize: true

  # Entitlements are deliberately *not* named here. electron-builder picks up
  # `entitlements.mac.plist` and `entitlements.mac.inherit.plist` from
  # buildResources (`resources/`) by filename and resolves them to absolute
  # paths; an explicit value is instead passed to codesign verbatim and resolved
  # against whatever directory the build was started from.

  # Shown in the system dialog when the updater's fallback path sends an Apple
  # event (`osascript ... with administrator privileges`). A hardened app that
  # sends one without this string is killed by the OS rather than prompted.
  extendInfo:
    NSAppleEventsUsageDescription: FastVibe 需要发送 Apple 事件来完成应用更新。
  files:
    - "!**/node_modules/node-pty/prebuilds/{win32,linux}-*/**"
    - "!**/node_modules/node-pty/prebuilds/darwin-!(${arch}){,/**/*}"
    - "!**/node_modules/koffi/build/koffi/{win32,linux,freebsd,openbsd,musl}_*/**"
    - "!**/node_modules/koffi/build/koffi/darwin_!(${arch}){,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/{win32,linux}{,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/darwin/src{,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/darwin/{build.sh,README.md}"
    - "!**/node_modules/@earendil-works/pi-tui/native/darwin/prebuilds/darwin-!(${arch}){,/**/*}"
    - "!**/node_modules/@mariozechner/clipboard-{win32,linux}-*/**"
    # Keep universal as the cross-arch fallback (CI builds x64 on arm64 macos
    # runners, which may not have clipboard-darwin-x64 installed). Drop the
    # other arch's package; the loader tries universal first, then ${arch}.
    - "!**/node_modules/@mariozechner/clipboard-darwin-!(${arch}|universal){,/**/*}"
    # ~50 MB per architecture, so shipping the other one doubles the cost of a feature
    # it cannot serve. pnpm normally installs only the host's package anyway; these
    # filters matter when a build host installs several (`supportedArchitectures`).
    - "!**/node_modules/@trycua/cua-driver-{win32,linux}-*{,/**/*}"
    - "!**/node_modules/@trycua/cua-driver-darwin-!(${arch}){,/**/*}"
  # No `arch:` here on purpose. `computeArchToTargetNamesMap` only falls back to the
  # architectures named on the command line when a target declares none of its own
  # (`archs == null ? defaultArchs : asArray(archs)`), so listing them here made
  # `--arm64` and `--x64` silently do nothing and every mac job built both. The
  # release workflow packages one architecture per job; `pnpm dist:mac` asks for both.
  target:
    - dmg
    - zip

win:
  icon: resources/icon.png
  files:
    - "!**/node_modules/node-pty/prebuilds/{darwin,linux}-*/**"
    - "!**/node_modules/node-pty/prebuilds/win32-!(${arch}){,/**/*}"
    - "!**/node_modules/koffi/build/koffi/{darwin,linux,freebsd,openbsd,musl}_*/**"
    - "!**/node_modules/koffi/build/koffi/win32_!(${arch}){,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/{darwin,linux}{,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/win32/src{,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/win32/{build.mjs,README.md}"
    - "!**/node_modules/@earendil-works/pi-tui/native/win32/prebuilds/win32-!(${arch}){,/**/*}"
    - "!**/node_modules/@mariozechner/clipboard-{darwin,linux}-*/**"
    - "!**/node_modules/@mariozechner/clipboard-win32-!(${arch}*){,/**/*}"
    - "!**/node_modules/@trycua/cua-driver-{darwin,linux}-*{,/**/*}"
    - "!**/node_modules/@trycua/cua-driver-win32-!(${arch}*){,/**/*}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: resources/icon.png
  category: Development
  files:
    - "!**/node_modules/node-pty/prebuilds/{darwin,win32}-*/**"
    - "!**/node_modules/node-pty/prebuilds/linux-!(${arch}){,/**/*}"
    - "!**/node_modules/koffi/build/koffi/{darwin,win32,freebsd,openbsd,musl}_*/**"
    - "!**/node_modules/koffi/build/koffi/linux_!(${arch}){,/**/*}"
    - "!**/node_modules/@earendil-works/pi-tui/native/{darwin,win32}{,/**/*}"
    - "!**/node_modules/@mariozechner/clipboard-{darwin,win32}-*/**"
    - "!**/node_modules/@mariozechner/clipboard-linux-!(${arch}*){,/**/*}"
    - "!**/node_modules/@trycua/cua-driver-{darwin,win32}-*{,/**/*}"
    - "!**/node_modules/@trycua/cua-driver-linux-!(${arch}*){,/**/*}"
  target:
    - AppImage
    - deb

# Baked into app-update.yml so electron-updater can find GitHub releases.
# Packaging still uses `--publish never`; CI uploads assets via action-gh-release.
publish:
  provider: github
  owner: tyuan511
  repo: fastvibe
